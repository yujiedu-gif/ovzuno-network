baseURL: https://crypto.ovzuno.com/
languageCode: en-us
title: OvZuno Crypto
theme: ovzuno
disableKinds: [RSS, taxonomy, term]
enableRobotsTXT: true
disableHugoGeneratorInject: true

pagination:
  pagerSize: 24
  path: page

frontmatter:
  lastmod: [lastmod, modified]

params:
  articlePagination: true
  siteKey: crypto
  publicationName: Crypto
  prelaunch: false
  seoTitle: OvZuno Crypto | Crypto Payments, Stablecoins and Wallet Infrastructure
  description: Independent technical coverage of crypto payments, stablecoin settlement, self-custodial wallets, crypto cards, PayFi, security, and compliance.
  heroTitle: Crypto payment infrastructure, clearly explained.
  heroLead: OvZuno Crypto explains the systems, payment rails, safeguards, and operating decisions behind crypto products for builders, operators, merchants, and business decision-makers.
  coverageHeadline: How crypto payments work in practice.
  scopeStatement: We cover payment and operating infrastructure without token promotion, trading signals, price predictions, investment advice, or undisclosed client marketing.
  footerStatement: Independent technical coverage of crypto payments, stablecoin settlement, wallets, cards, security, and compliance.
  topics:
    - name: Crypto payments and merchant infrastructure
      description: Gateways, processors, APIs, checkout, settlement, refunds, reconciliation, and merchant integration.
    - name: Stablecoins and settlement
      description: Issuance models, reserves, payment flows, cross-border settlement, liquidity, redemption, USDC, and USDT.
    - name: Wallets, custody and key management
      description: Self-custody, MPC, multisig, recovery, signing, access controls, and wallet infrastructure.
    - name: Blockchain foundations for payments
      description: Finality, confirmations, fees, signatures, smart contracts, and the concepts required to understand payment systems.
    - name: Security and compliance
      description: Smart-contract risk, transaction monitoring, fraud controls, identity requirements, and operational resilience.
    - name: Crypto cards and spending rails
      description: Card funding, authorization, conversion, settlement, refunds, limits, and stablecoin spending flows.
    - name: Cross-chain interoperability
      description: Bridges, messaging, liquidity, wrapped assets, finality, reconciliation, and cross-chain risk.
    - name: PayFi, DeFi and agentic payments
      description: Programmable payment flows, PayFi infrastructure, automated stablecoin payments, and agent transaction controls.

menus:
  main:
    - {name: Home, pageRef: /, weight: 10}
    - {name: Topics, pageRef: /topics, weight: 20}
    - {name: Articles, pageRef: /articles, weight: 30}
    - {name: About, pageRef: /about, weight: 40}
