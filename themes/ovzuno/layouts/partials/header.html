<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }} home">
      {{ partial "logo.html" (dict "compact" false) }}
      {{ if ne .Site.Params.siteKey "root" }}
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="publication-name">{{ .Site.Params.publicationName }}</span>
      {{ end }}
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ if eq .Site.Params.siteKey "root" }}<a class="site-nav__cta" href="{{ .Site.Home.RelPermalink }}#network">Explore publications <span aria-hidden="true">↓</span></a>{{ end }}
    </nav>
  </div>
</header>
