{{- $destination := urls.Parse .Destination -}}
{{- $base := urls.Parse .Page.Site.BaseURL -}}
{{- $external := and $destination.IsAbs (ne $destination.Host $base.Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} rel="nofollow noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
